<div class="home-layout">
  <app-table-action-bar
    [$resultCount]="_store.total()"
    [$columnGroups]="_store.columnGroups()"
    [$selectedTable]="_store.selectedTable()"
    [$selectedColumns]="_store.selectedColumns()"
    [$hasActiveFilters]="_$hasActiveFilters()"
    [$isExportMode]="_$isExportMode()"
    [$selectedExportCount]="_$selectedExportCount()"
    (entitySelected)="onEntitySelected($event)"
    (columnToggle)="onColumnToggle($event)"
    (columnReorder)="onColumnReorder($event)"
    (exportExcel)="onExportExcel()"
    (exportConfirm)="onExportConfirm()"
    (exportCancel)="onExportCancel()"
    (clearFilters)="onClearFilters()"
    (uploadClick)="onUploadClick()"
  />
  <app-home-table
    [$isExportMode]="_$isExportMode()"
    [$selectedExportIndices]="_$selectedExportIndices()"
    (rowExportToggled)="onRowExportToggled($event)"
  />
</div>
