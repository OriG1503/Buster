<div class="date-range-wrapper">
  <button
    type="button"
    class="date-btn"
    [class.date-btn-open]="$isPopupOpen()"
    [class.date-btn-has-data]="$isActive()"
    (click)="togglePopup()"
  >
    <i class="pi pi-calendar date-btn-icon"></i>
    <span class="date-btn-label">
      {{ $buttonLabel() }}
    </span>
    <i
      class="pi date-btn-icon date-btn-icon-chevron"
      [class.pi-chevron-up]="$isPopupOpen()"
      [class.pi-chevron-down]="!$isPopupOpen()"
    ></i>
  </button>

  @if ($isPopupOpen()) {
    <div class="popup-container">
      <div class="mode-toggle">
        <button
          type="button"
          class="toggle-btn"
          [class.toggle-btn-active]="$selectedMode() === 'verbal'"
          (click)="selectMode('verbal')"
        >
          {{ modeLabels.verbal }}
        </button>
        <button
          type="button"
          class="toggle-btn"
          [class.toggle-btn-active]="$selectedMode() === 'calendar'"
          (click)="selectMode('calendar')"
        >
          {{ modeLabels.calendar }}
        </button>
      </div>

      <div class="divider"></div>

      @if ($selectedMode() === 'calendar') {
        <app-calendar-view
          [dateRange]="$dateRange()"
          (dateSelect)="onCalendarSelect($event)"
        />
      } @else if ($selectedMode() === 'verbal') {
        <app-verbal-view (verbalChange)="onVerbalChange($event)" />
      }
    </div>
  }
</div>
