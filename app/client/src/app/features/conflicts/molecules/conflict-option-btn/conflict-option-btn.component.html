<button
  class="conflict-item__option"
  [class.conflict-item__option--red]="$variant() === 'red'"
  [class.conflict-item__option--white]="$variant() === 'white'"
  [class.conflict-item__option--selected]="$isSelected()"
  [disabled]="$isDisabled()"
  (click)="selected.emit()"
>
  <span
    class="conflict-item__dot"
    [class.conflict-item__dot--active]="$isSelected()"
  ></span>

  @if ($isIdStyle()) {
    <span
      class="conflict-item__id"
      [class.conflict-item__id--red]="$variant() === 'red'"
      [class.conflict-item__id--yellow]="$isYellow()"
    >{{ $label() }}</span>
  } @else {
    <span
      class="conflict-item__value conflict-item__value--red"
      [class.conflict-item__value--yellow]="$isYellow()"
    >{{ $label() }}</span>
  }

  @if ($source() || _$formattedSourceTime()) {
    <span class="conflict-item__source-group">
      <span class="conflict-item__source-label">מ"ד</span>
      <span class="conflict-item__source-label-sep"></span>
      @if ($source()) {
        <span class="conflict-item__source-name">{{ $source() }}</span>
      }
      @if ($source() && _$formattedSourceTime()) {
        <span class="conflict-item__source-divider">·</span>
      }
      @if (_$formattedSourceTime()) {
        <span class="conflict-item__source-time">{{ _$formattedSourceTime() }}</span>
      }
    </span>
  }

  @if ($date()) {
    <span class="conflict-item__meta">
      <span class="conflict-item__meta-label">הועלה</span>
      {{ $date() }}
    </span>
  }

  @if ($notes()) {
    <span class="conflict-item__comment">{{ $notes() }}</span>
  }
</button>
