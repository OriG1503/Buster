<div class="conflict-item-footer">
  <button
    class="conflict-item-footer__resolve-btn"
    [disabled]="!$canResolve() || $isResolving()"
    (click)="resolve.emit()"
  >
    @if ($isResolving()) {
      <i class="pi pi-spin pi-spinner"></i>
    } @else {
      אישור
    }
  </button>
  <div class="conflict-item-footer__notes-wrap">
    <input
      class="conflict-item-footer__notes-input"
      type="text"
      placeholder="פרט את סיבת הבחירה... (שדה חובה)"
      [value]="$notes()"
      (input)="notesChange.emit($any($event.target).value)"
    />
  </div>
</div>
